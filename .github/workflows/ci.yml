name: BitePulse CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend Build and Lint Verification
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Build (React + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Build Production Assets
        run: npm run build
        env:
          VITE_API_URL: https://api.bitepulse.campus/api

  # -------------------------------------------------------------
  # Job 2: Backend Build and Test Verification
  # -------------------------------------------------------------
  backend-build:
    name: Backend Build (Spring Boot 3 + Java 17)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean compile test-compile
